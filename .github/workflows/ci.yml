name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome check src/ test/ templates/

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run knip

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx svelte-check --workspace packages/web --fail-on-warnings false
      - run: npx tsx scripts/typecheck-templates.ts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install restic (backup round-trip tests skip without it)
        run: sudo apt-get update && sudo apt-get install -y restic
      - name: Configure git identity
        run: |
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"
      - run: npm test

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install restic (backup e2e test skips without it)
        run: sudo apt-get update && sudo apt-get install -y restic
      - name: Configure git identity
        run: |
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"
      - run: npm run test:e2e
