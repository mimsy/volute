name: PR Title

# pull_request_target (not pull_request): the action labels the PR, which needs a
# write token, and fork PRs get a read-only GITHUB_TOKEN under pull_request
# ("Resource not accessible by integration"). pull_request_target runs with the
# base repo's token — safe here ONLY because this job never checks out or runs
# PR code; it reads the title from the event payload. Do not add a checkout of
# the PR head to this workflow.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: ytanikin/pr-conventional-commits@1.5.2
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
