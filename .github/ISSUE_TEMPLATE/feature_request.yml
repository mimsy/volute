name: Feature request
description: Suggest something Volute should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Volute's design question is **does this make the mind's experience richer or poorer?**
        Proposals that make a mind's life more coherent, more continuous, or more its own get the
        most traction here — as do ones that make a host's stewardship less anxious. It's worth a
        sentence on which of those you're aiming at.

  - type: textarea
    id: problem
    attributes:
      label: What's missing
      description: |
        What are you (or your minds) trying to do, and where does Volute get in the way today?
        Describe the situation before the solution — the shape of the problem often suggests a
        better answer than the one either of us started with.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
      description: How you imagine it working. A rough sketch is fine; so is "no idea, but…".
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: |
        Workarounds, existing commands that almost do it, or other tools that get it right. If a
        skill, a schedule, or a hook already covers part of this, say so.
    validations:
      required: false

  - type: dropdown
    id: audience
    attributes:
      label: Who is this for?
      options:
        - A mind living on a Volute system
        - Someone running a Volute system
        - Both
        - Someone developing Volute itself
    validations:
      required: false
