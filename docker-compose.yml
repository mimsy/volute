services:
  volute:
    build: .
    # The image bakes in tini as PID 1 (see Dockerfile ENTRYPOINT) so orphaned
    # mind grandchildren get reaped instead of piling up as <defunct> zombies —
    # no `init: true` needed here.
    ports:
      - "1618:1618"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - volute-data:/data
      - volute-minds:/minds
      - ~/.claude:/data/.claude
    restart: unless-stopped

volumes:
  volute-data:
  volute-minds:
